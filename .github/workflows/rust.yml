name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      # Install 6502 cross-assemblers on Linux so roundtrip tests exercise 64tass, ACME, and ca65 in CI.
      - name: Install 6502 Assemblers (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y 64tass acme cc65

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check Formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

      - name: Verify Project Roundtrips (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          for proj in \
            tests/6502/rq_intro_01.regen2000proj \
            tests/6502/test_dispatch_table.regen2000proj \
            tests/6502/test_text.regen2000proj; do
            echo "=== Verifying $proj ==="
            output=$(target/debug/regenerator2000 --verify "$proj") || { echo "$output"; exit 1; }
            echo "$output"
            for expected in "✓ 64tass" "✓ ACME" "✓ ca65"; do
              if ! printf '%s\n' "$output" | grep -qF "$expected"; then
                echo "ERROR: Expected '$expected' to pass for $proj (assembler may have been skipped)"
                exit 1
              fi
            done
          done

      - name: Audit Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo install cargo-audit
          for i in 1 2 3; do
            cargo audit && break
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
